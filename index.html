<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff1f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="damagoch.dogi">
<meta name="mobile-web-app-capable" content="yes">
<title>damagoch.dogi Launcher</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#ffe9f2,#ddd8ff 55%,#ccefff);color:#3c3340;overscroll-behavior:none}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer}
.app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(94vw,460px);background:#ffffffdf;border-radius:30px;padding:24px;box-shadow:0 22px 70px #57445b33;backdrop-filter:blur(16px);text-align:center}
.logo{width:112px;height:112px;border-radius:28px;margin:0 auto 14px;display:block}
h1{margin:0;font-size:31px;letter-spacing:-1px}
.sub{font-size:13px;color:#766b75;margin:8px 0 18px}
.status{background:#f4f1f7;border-radius:15px;padding:12px;text-align:left;font-size:13px;display:grid;gap:6px}
.status b{display:inline-block;min-width:84px}
.main-btn{width:100%;margin-top:12px;background:linear-gradient(90deg,#ffd66b,#ffb8d2);font-size:17px}
.secondary{width:100%;margin-top:9px;background:#e7f1ff}
.admin{width:100%;margin-top:9px;background:#ece8f4}
.install{width:100%;margin-top:9px;background:#dff6ec}
.notice{display:none;margin-top:12px;background:#fff7df;border-radius:16px;padding:13px;text-align:left}
.notice.show{display:block}
.notice h3{margin:0 0 6px}
.notice pre{white-space:pre-wrap;margin:0;font-family:inherit;font-size:13px}
.notice-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.notice-actions button:first-child{background:#bcebdc}.notice-actions button:last-child{background:#eee}
.overlay{position:fixed;inset:0;display:none;background:#fff;z-index:20}
.overlay.show{display:block}
.gamebar{height:52px;display:flex;align-items:center;gap:8px;padding:8px;background:#fff1f6;border-bottom:1px solid #eadfe5}
.gamebar button{padding:9px 11px;background:#ece8f4}
.gamebar .grow{flex:1;text-align:left;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{width:100%;height:calc(100dvh - 52px);border:0;background:#fff}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#0006;z-index:40}
.modal.show{display:flex}
.sheet{width:min(94vw,460px);max-height:88dvh;overflow:auto;background:#fff;border-radius:24px;padding:18px}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;text-align:left;font-size:12px;font-weight:900;margin-top:10px}
.sheet input{width:100%;margin-top:5px;padding:11px;border:1px solid #ddd;border-radius:11px;user-select:text;-webkit-user-select:text}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.save{background:#bcebdc}.close{background:#eee}
.tiny{font-size:11px;color:#766}
.error{color:#a13d3d}.ok{color:#237447}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <img class="logo" src="icons/icon-192.png" alt="damagoch.dogi">
    <h1>damagoch.dogi</h1>
    <div class="sub">설치형 게임 런처</div>

    <div class="status">
      <div><b>런처 버전</b><span id="launcherVersion">1.0.0</span></div>
      <div><b>게임 주소</b><span id="gameHost">확인 중</span></div>
      <div><b>현재 게임</b><span id="currentVersion">확인 중</span></div>
      <div><b>최신 버전</b><span id="latestVersion">확인 중</span></div>
    </div>

    <div class="notice" id="updateNotice">
      <h3>📢 업데이트 관련 안내</h3>
      <div class="tiny" id="updateMeta"></div>
      <pre id="updateNotes">업데이트 내용</pre>
      <div class="notice-actions">
        <button id="updateAndPlayBtn">업데이트 후 실행</button>
        <button id="laterBtn">나중에</button>
      </div>
    </div>

    <button class="main-btn" id="playBtn">게임 시작</button>
    <button class="secondary" id="checkBtn">업데이트 확인</button>
    <button class="install" id="installBtn">📲 런처 설치</button>
    <button class="admin" id="adminBtn">🛠️ 런처 설정</button>
    <div class="tiny" id="message" style="margin-top:10px">최신 버전을 확인하고 있습니다.</div>
  </div>
</div>

<div class="overlay" id="gameOverlay">
  <div class="gamebar">
    <button id="backBtn">← 런처</button>
    <div class="grow" id="gameTitle">damagoch.dogi</div>
    <button id="reloadBtn">↻</button>
    <button id="externalBtn">↗</button>
  </div>
  <iframe id="gameFrame" allow="clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<div class="modal" id="loginModal">
  <div class="sheet">
    <h3>런처 관리자</h3>
    <label>패스키<input id="passInput" type="password"></label>
    <div class="grid">
      <button class="save" id="loginBtn">입장</button>
      <button class="close" data-close="loginModal">닫기</button>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="sheet">
    <h3>런처 설정</h3>
    <label>게임 주소<input id="gameUrlInput" placeholder="https://example.com/"></label>
    <label>버전 파일 경로<input id="versionPathInput" value="version.json"></label>
    <label>게임 표시 이름<input id="gameNameInput" value="damagoch.dogi"></label>
    <div class="tiny" style="margin-top:10px">게임 사이트의 최상위에 version.json이 있으면 버전과 업데이트 내용을 자동 확인할 수 있습니다.</div>
    <div class="grid">
      <button class="save" id="saveSettingsBtn">저장</button>
      <button class="close" data-close="settingsModal">닫기</button>
    </div>
  </div>
</div>

<script>
const LAUNCHER_VERSION="1.0.0";
const STORAGE_KEY="damagoch_launcher_settings_v1";
const DEFAULTS={
  gameUrl:"https://steady-daifuku-d02fd8.netlify.app/",
  versionPath:"version.json",
  gameName:"damagoch.dogi"
};
let settings=loadSettings();
let latestInfo=null;
let deferredPrompt=null;

function $(id){return document.getElementById(id)}
function normalizeUrl(url){
  let value=String(url||"").trim();
  if(!value)return "";
  if(!/^https?:\/\//i.test(value))value="https://"+value;
  if(!value.endsWith("/"))value+="/";
  return value;
}
function loadSettings(){
  try{return {...DEFAULTS,...JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}}
  catch{return {...DEFAULTS}}
}
function saveSettings(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(settings));
}
function compareVersions(a,b){
  const pa=String(a||"0").split(".").map(n=>Number(n)||0);
  const pb=String(b||"0").split(".").map(n=>Number(n)||0);
  const len=Math.max(pa.length,pb.length);
  for(let i=0;i<len;i++){
    if((pa[i]||0)>(pb[i]||0))return 1;
    if((pa[i]||0)<(pb[i]||0))return -1;
  }
  return 0;
}
function currentGameVersion(){
  return localStorage.getItem("damagoch_launcher_game_version")||"미확인";
}
function render(){
  $("launcherVersion").textContent=LAUNCHER_VERSION;
  $("gameHost").textContent=new URL(settings.gameUrl).host;
  $("currentVersion").textContent=currentGameVersion();
  $("latestVersion").textContent=latestInfo?.version||"확인 중";
  $("gameTitle").textContent=settings.gameName;
}
async function checkUpdate(showMessage=true){
  try{
    $("message").textContent="최신 버전을 확인하고 있습니다.";
    const url=settings.gameUrl+settings.versionPath.replace(/^\/+/,"")+"?t="+Date.now();
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok)throw new Error("버전 파일을 불러오지 못했습니다.");
    latestInfo=await res.json();
    const current=currentGameVersion();
    const needs=current==="미확인"||compareVersions(latestInfo.version,current)>0;
    $("latestVersion").textContent=latestInfo.version||"알 수 없음";
    if(needs){
      $("updateMeta").textContent=`현재 ${current} → 최신 ${latestInfo.version}`;
      $("updateNotes").textContent=latestInfo.notes||latestInfo.name||"새 업데이트가 준비됐습니다.";
      $("updateNotice").classList.add("show");
      $("message").textContent="새 업데이트가 있습니다.";
      notifyUpdate();
    }else{
      $("updateNotice").classList.remove("show");
      $("message").textContent=showMessage?"현재 최신 버전입니다.":"";
    }
    render();
  }catch(err){
    $("message").innerHTML='<span class="error">'+err.message+'</span>';
    $("latestVersion").textContent="확인 실패";
  }
}
async function notifyUpdate(){
  if(!("Notification" in window)||Notification.permission!=="granted"||!latestInfo)return;
  const reg=await navigator.serviceWorker.ready;
  reg.showNotification("업데이트 관련 안내",{
    body:`${settings.gameName} v${latestInfo.version} 업데이트가 준비됐습니다.`,
    icon:"icons/icon-192.png",
    badge:"icons/icon-192.png",
    tag:"damagoch-launcher-update",
    data:{url:"./"}
  });
}
function launchGame(forceUpdate=false){
  const version=latestInfo?.version||currentGameVersion();
  if(version&&version!=="미확인"){
    localStorage.setItem("damagoch_launcher_game_version",version);
  }
  const sep=settings.gameUrl.includes("?")?"&":"?";
  const cacheBuster=forceUpdate?`${sep}launcherVersion=${encodeURIComponent(version)}&t=${Date.now()}`:"";
  $("gameFrame").src=settings.gameUrl+cacheBuster;
  $("gameOverlay").classList.add("show");
  $("updateNotice").classList.remove("show");
  render();
}
function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}

$("playBtn").onclick=()=>launchGame(false);
$("updateAndPlayBtn").onclick=()=>launchGame(true);
$("laterBtn").onclick=()=>$("updateNotice").classList.remove("show");
$("checkBtn").onclick=()=>checkUpdate(true);
$("backBtn").onclick=()=>{$("gameOverlay").classList.remove("show");$("gameFrame").src="about:blank"};
$("reloadBtn").onclick=()=>{$("gameFrame").src=settings.gameUrl+"?t="+Date.now()};
$("externalBtn").onclick=()=>window.open(settings.gameUrl,"_blank","noopener");
$("adminBtn").onclick=()=>{$("passInput").value="";openModal("loginModal")};
$("loginBtn").onclick=()=>{
  if($("passInput").value!=="bidolgidamagoch"){alert("패스키가 올바르지 않습니다.");return}
  closeModal("loginModal");
  $("gameUrlInput").value=settings.gameUrl;
  $("versionPathInput").value=settings.versionPath;
  $("gameNameInput").value=settings.gameName;
  openModal("settingsModal");
};
$("saveSettingsBtn").onclick=()=>{
  const url=normalizeUrl($("gameUrlInput").value);
  if(!url){alert("게임 주소를 입력하세요.");return}
  settings={
    gameUrl:url,
    versionPath:$("versionPathInput").value.trim()||"version.json",
    gameName:$("gameNameInput").value.trim()||"damagoch.dogi"
  };
  saveSettings();latestInfo=null;closeModal("settingsModal");render();checkUpdate(true);
};
document.querySelectorAll("[data-close]").forEach(btn=>btn.onclick=()=>closeModal(btn.dataset.close));

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="block"});
$("installBtn").onclick=async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    return;
  }
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    alert("Safari의 공유 버튼 → 홈 화면에 추가를 눌러 설치하세요.");
  }else{
    alert("Chrome 메뉴의 앱 설치 또는 홈 화면에 추가를 눌러 설치하세요.");
  }
};

async function registerSW(){
  if(!("serviceWorker" in navigator))return;
  try{
    await navigator.serviceWorker.register("./service-worker.js");
    if("Notification" in window&&Notification.permission==="default"){
      setTimeout(()=>Notification.requestPermission(),1200);
    }
  }catch(err){console.error(err)}
}
render();
registerSW();
checkUpdate(false);
</script>
</body>
</html>
